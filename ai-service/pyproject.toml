[project]
name = "scresh-ai-service"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "pillow==11.2.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
inference = [
  "timm==1.0.15",
  "torch==2.7.0",
  "transformers==4.57.1",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
